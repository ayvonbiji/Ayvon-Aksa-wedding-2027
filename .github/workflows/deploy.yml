name: Build site into docs/

# GitHub Pages is set to "Deploy from a branch: main / docs".
# Whenever the source changes, this workflow tests and rebuilds the site and
# commits the result to docs/. GitHub Pages then publishes docs/ automatically.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:docs
        env:
          # Optional: set these under Settings → Secrets and variables → Actions → Variables
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Commit docs/ if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs/ already up to date"
          else
            git commit -m "Rebuild site into docs/ [skip ci]"
            git push
          fi
